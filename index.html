<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaiah's Taco Truck</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-teal-700">

    <h1 class="m-4 text-2xl font-bold">Isaiah's Taco Truck</h1>

    <p id="status" class="m-4">Closed</p>
     
    <button id="open-button" class="border px-3 py-1 m-4">Open the truck</button>
   

    <div class="my-4">
        <label for="new-location" class="block m-4 text-2xl font-bold "></label>
        <input id="new-location" type="text" class="border p-1 m-4">
        <button id="set-button" class="border px-3 py-1">Set</button>
    </div>

    <ul id="Location-today" type="text" class="text-xl font-semibold  pl-5">Today's Location</ul>
    
   <form id="menu-form" class="my-4">
  <label for="new-item" class="block mb-1 mx-4">Item</label>
  <input id="new-item" type="text" class="border p-2 mx-4">

  <label for="description" class="block mb-1 mt-2 mx-4">description</label>
  <input id="description" type="text" class="border p-12 mx-4">


  <button id="add-button" type="submit" class="border px-3 py-1 mt-2">Add item</button>
</form>

         <h2 class="m-4 text-2xl font-bold">Menu</h2>
        <ul id="menu-list" class="list-disc pl-5"></ul>

        <h3 id="total-sold" class="m-4 text-2xl font-bold">Total Sold: </h3>
    <script src="script.js"></script>
</body>

</html>
